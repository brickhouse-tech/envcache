[package]
name = "envcache"
version = "0.1.0"
edition = "2021"
authors = ["Nicholas McCready"]
description = "Cache environment secrets from 1Password and other secret managers with TTL"
license = "MIT"
repository = "https://github.com/brickhouse-tech/envcache"
readme = "README.md"
keywords = ["env", "cache", "secrets", "1password", "dotenv"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/"]

[lib]
name = "envcache"
path = "src/lib.rs"

[[bin]]
name = "envcache"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
